name: 同步 Gitee Git 引用
on:
  push:
    tags: ['**']
permissions:
  contents: read
concurrency:
  group: rmt-gitee-git-refs
  cancel-in-progress: false
jobs:
  mirror:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: 对齐代码、分支与标签
        env:
          GIT_TERMINAL_PROMPT: '0'
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
        run: python3 .github/scripts/mirror_rmt_refs.py
