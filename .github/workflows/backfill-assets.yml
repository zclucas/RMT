name: 补齐 Gitee 资源

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.list.outputs.tags }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh api --paginate repos/zclucas/RMTAssets/releases | jq -cs '[.[][] | select(.draft == false) | .tag_name]')
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  mirror:
    needs: list
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.list.outputs.tags) }}
    runs-on: windows-latest
    concurrency: gitee-assets-${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_ASSETS_TOKEN || secrets.GITEE_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: ./.github/scripts/Sync-GiteeAssets.ps1 -Tag $env:RELEASE_TAG
