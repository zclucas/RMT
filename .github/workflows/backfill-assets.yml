name: 补齐 GitCode 资源
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 资源标签；留空处理全部发行版
        type: string
      asset_name:
        description: 原附件名；留空处理整个标签
        type: string
permissions:
  contents: read
concurrency:
  group: gitcode-resource-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: inputs.asset_name != 'Index-Translate-2B.Q4_K_M.gguf'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 同步原文件并验证公开下载
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_RELEASE }}
          RELEASE_TAG: ${{ inputs.tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: python3 -u .github/scripts/sync_gitcode_assets.py sync --tag "$RELEASE_TAG" --asset-name "$ASSET_NAME" --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitcode-sync-result
          path: ${{ runner.temp }}/gitcode-sync.json
  model:
    needs: mirror
    if: ${{ !cancelled() && (needs.mirror.result == 'success' || needs.mirror.result == 'skipped') && (inputs.tag == '' || inputs.tag == 'Common') && (inputs.asset_name == '' || inputs.asset_name == 'Index-Translate-2B.Q4_K_M.gguf') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 按所选策略同步翻译模型
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_RELEASE }}
        run: python3 -u .github/scripts/sync_gitcode_assets.py model --model-mode configured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitcode-model-result
          path: ${{ runner.temp }}/gitcode-model.json
