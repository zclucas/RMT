name: 补齐 Gitee 资源
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 资源标签；留空处理所有发行版
        type: string
      asset_name:
        description: 原附件文件名；留空处理整个标签
        type: string
      verify_archive:
        description: 从 Gitee 下载合并并解压指定 tar.bz2
        type: boolean
        default: false
      diagnostic_build:
        description: 仅回读已有 Gitee Go 构建日志（排障用）
        type: string
permissions:
  contents: read
jobs:
  list:
    if: inputs.diagnostic_build == ''
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.list.outputs.tags }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          VERIFY: ${{ inputs.verify_archive }}
        run: |
          set -euo pipefail
          if [[ -n "$ASSET_NAME" || "$VERIFY" == true ]]; then
            [[ -n "$INPUT_TAG" ]] || { echo 'A tag is required for a targeted test.'; exit 1; }
          fi
          if [[ "$VERIFY" == true ]]; then
            [[ "$ASSET_NAME" == *.tar.bz2 ]] || { echo 'Select a tar.bz2 attachment to verify.'; exit 1; }
          fi
          if [[ -n "$INPUT_TAG" ]]; then
            tags=$(jq -cn --arg tag "$INPUT_TAG" '[$tag]')
          else
            tags=$(gh api --paginate repos/zclucas/RMTAssets/releases | jq -cs '[.[][] | select(.draft == false) | .tag_name]')
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
  prepare:
    name: 为原附件补发分片
    needs: list
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.list.outputs.tags) }}
    runs-on: windows-latest
    timeout-minutes: 90
    concurrency:
      group: github-asset-volumes-${{ matrix.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RMT_ASSETS_TOKEN }}
          RELEASE_TAG: ${{ matrix.tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: ./.github/scripts/Publish-RmtAssetVolumes.ps1 -Tag $env:RELEASE_TAG -AssetName $env:ASSET_NAME
  mirror:
    name: 复用 Gitee Go 同步与回读
    needs: [list, prepare]
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.list.outputs.tags) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: gitee-assets-${{ matrix.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_ASSETS_TOKEN || secrets.GITEE_RELEASE_TOKEN }}
      RELEASE_TAG: ${{ matrix.tag }}
      ASSET_NAME: ${{ inputs.asset_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: API 上传并回读指定附件
        id: direct
        continue-on-error: true
        timeout-minutes: 12
        shell: pwsh
        run: ./.github/scripts/Sync-GiteeAssets.ps1 -Tag $env:RELEASE_TAG -AssetName $env:ASSET_NAME
      - run: python3 -m pip install PyYAML==6.0.2
        if: steps.direct.outcome == 'failure'
      - name: Gitee Go 同步分片并回读 SHA-256
        id: go
        if: steps.direct.outcome == 'failure'
        continue-on-error: true
        run: python3 -u .github/scripts/sync_gitee_go.py assets-go
      - name: 服务器补传并回读
        if: steps.go.outcome == 'failure'
        env:
          RELAY_KEY: ${{ secrets.RMT_RELAY_SSH_KEY }}
          KNOWN_HOST: ${{ vars.RMT_RELAY_KNOWN_HOST }}
        run: python3 -u .github/scripts/sync_gitee_go.py assets-relay
  verify:
    name: Gitee 下载合并解压实测
    needs: mirror
    if: inputs.verify_archive
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: ./.github/scripts/Verify-RmtAssetRoundtrip.ps1 -Tag $env:RELEASE_TAG -AssetName $env:ASSET_NAME
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-roundtrip-result
          path: ${{ runner.temp }}/rmt-volume-check/result.json
          if-no-files-found: warn
  diagnose:
    if: inputs.diagnostic_build != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_ASSETS_TOKEN || secrets.GITEE_RELEASE_TOKEN }}
          GITEE_BUILD_ID: ${{ inputs.diagnostic_build }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, '.github/scripts')
          from sync_gitee_go import http, go_stage
          base = 'https://go-api.gitee.com/fateman/RMTAssets/gitee-go/ipipe/rest/v5/pipelines/builds'
          current = http(base + '/' + str(int(os.environ['GITEE_BUILD_ID'])) + '/status', os.environ['GITEE_RELEASE_TOKEN'])['data']
          for stage in current.get('stages', []):
              detail = go_stage(base, stage['id'])
              for group in detail['jobs']:
                  for job in group:
                      for entry in (job.get('record') or {}).get('stages') or []:
                          from urllib.parse import urlsplit
                          url = entry.get('logger') or ''
                          if urlsplit(url).netloc == 'go-api.gitee.com' and urlsplit(url).scheme == 'https':
                              print(json.dumps(http(url, os.environ['GITEE_RELEASE_TOKEN']).get('data', {}).get('logs', [])[-80:], ensure_ascii=True))
          PY
