name: 补齐 GitCode 资源
on:
  workflow_dispatch:
    inputs:
      resource_runner:
        description: 迁移 runner 标签（默认 macos-latest，可指定一次性自托管 runner）
        type: string
        default: macos-latest
      reorganize_resources:
        description: 按版本、Common、Patch 重组两站资源（不兼容旧版 Common 地址）
        type: boolean
        default: false
      cleanup_sponsor:
        description: 校验 Sponsor.zip 后删除两站 Common 中单独的 rmt.png
        type: boolean
        default: false
      tag:
        description: 资源标签；留空处理全部发行版
        type: string
      asset_name:
        description: 原附件名；留空处理整个标签
        type: string
permissions:
  contents: read
concurrency:
  group: rmt-resource-publication
  cancel-in-progress: false
jobs:
  mirror:
    if: ${{ !inputs.reorganize_resources && !inputs.cleanup_sponsor }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 同步原文件并验证公开下载
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_RELEASE }}
          RELEASE_TAG: ${{ inputs.tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          if [[ "$ASSET_NAME" == 'Index-Translate-2B.Q4_K_M.gguf' ]]; then
            echo '::error::模型变更请使用更新共享或修补资源工作流，以归档旧版本依赖。'
            exit 1
          fi
          python3 -u .github/scripts/sync_gitcode_assets.py sync --tag "$RELEASE_TAG" --asset-name "$ASSET_NAME" --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitcode-sync-result
          path: ${{ runner.temp }}/gitcode-sync.json
  cleanup_sponsor:
    name: 清理单独的赞助 Logo
    if: ${{ inputs.cleanup_sponsor && !inputs.reorganize_resources }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 校验两站 Sponsor.zip 并删除 Common/rmt.png
        env:
          GH_TOKEN: ${{ secrets.RMT_ASSETS_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_RELEASE }}
        run: python3 -u .github/scripts/sync_gitcode_assets.py sponsor-cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sponsor-cleanup-result
          path: ${{ runner.temp }}/gitcode-sponsor-cleanup.json
  reorganize:
    name: 重组两站资源
    if: inputs.reorganize_resources
    runs-on: ${{ inputs.resource_runner || 'macos-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 建立清单、复制校验并清理旧位置
        env:
          GH_TOKEN: ${{ secrets.RMT_ASSETS_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_RELEASE }}
        shell: pwsh
        run: |
          if ($IsWindows) { python -u .github/scripts/resource_layout.py migrate }
          else { python3 -u .github/scripts/resource_layout.py migrate }
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-layout-result
          path: ${{ runner.temp }}/resource-layout-result.json
