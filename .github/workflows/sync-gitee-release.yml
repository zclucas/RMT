name: 同步 Gitee 发行版
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      asset_tags:
        required: true
        type: string
      source_sha:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 已在 GitHub 发布的版本标签
        required: true
        type: string
      asset_tags:
        description: 资源标签 JSON 数组（默认此版本 x64 和 x86）
        type: string

permissions:
  contents: read
concurrency:
  group: gitee-publish-${{ inputs.tag }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag }}
  ASSET_TAGS: ${{ inputs.asset_tags }}
  GIT_TERMINAL_PROMPT: '0'

jobs:
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 对齐 Gitee RMT 的代码、分支和标签
        env:
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -eu
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)+(F[0-9]+)?$ ]]
          actual=$(gh api "repos/zclucas/RMT/commits/$RELEASE_TAG" --jq .sha)
          [[ -z "$SOURCE_SHA" || "$SOURCE_SHA" == "$actual" ]]
          python3 .github/scripts/mirror_rmt_refs.py
  go:
    outputs:
      primary_result: ${{ steps.publish.outcome }}
    needs: refs
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.2
      - name: Gitee Go 发布并回读所有附件
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
        run: python3 -u .github/scripts/sync_gitee_go.py go
  fallback:
    needs: [refs, go]
    if: ${{ !cancelled() && needs.refs.result == 'success' && (needs.go.result == 'failure' || needs.go.outputs.primary_result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 服务器补传并回读所有附件
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
          RELAY_KEY: ${{ secrets.RMT_RELAY_SSH_KEY }}
          KNOWN_HOST: ${{ vars.RMT_RELAY_KNOWN_HOST }}
        run: python3 -u .github/scripts/sync_gitee_go.py relay
