name: 同步 Gitee 发行版

on:
  workflow_run:
    workflows: [版本发布]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: '已在 GitHub 发布的标签（例如 v1.3F3）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitee-release-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
  RELEASE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
  GIT_TERMINAL_PROMPT: '0'

jobs:
  prepare:
    if: >-
      github.repository == 'zclucas/RMT' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 准备 Gitee 标签和发行说明
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
        run: ./.github/scripts/Sync-GiteeRelease.ps1 -Tag $env:RELEASE_TAG -PrepareOnly

      - name: 触发 CNB 上传并等待公开下载校验
        if: vars.CNB_RELEASE_REPO != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_RELEASE_REPO: ${{ vars.CNB_RELEASE_REPO }}
          CNB_TRIGGER_TOKEN: ${{ secrets.CNB_TRIGGER_TOKEN }}
        run: ./.github/scripts/Start-CnbGiteeRelease.ps1 -Tag $env:RELEASE_TAG

  package:
    if: vars.CNB_RELEASE_REPO == ''
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 上传并回读校验 ${{ matrix.arch }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: ./.github/scripts/Sync-GiteeRelease.ps1 -Tag $env:RELEASE_TAG -Arch $env:ARCH
