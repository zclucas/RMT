name: 同步 Gitee 发行版

on:
  workflow_run:
    workflows: [版本发布]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: '已在 GitHub 发布的标签（例如 v1.3F3）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitee-release-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
  RELEASE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
  GIT_TERMINAL_PROMPT: '0'

jobs:
  prepare:
    if: >-
      github.repository == 'zclucas/RMT' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 准备 Gitee 标签和发行说明
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
        run: ./.github/scripts/Sync-GiteeRelease.ps1 -Tag $env:RELEASE_TAG -PrepareOnly

  relay:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 由 RMTServer 拉取、上传和校验 x64 与 x86
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_KEY: ${{ secrets.RMT_RELAY_SSH_KEY }}
          KNOWN_HOST: ${{ vars.RMT_RELAY_KNOWN_HOST }}
          PROBE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf -- "$dir"' EXIT
          printf '%s\n' "$RELAY_KEY" > "$dir/key"
          unset RELAY_KEY
          printf '%s\n' "$KNOWN_HOST" > "$dir/known_hosts"
          host=${KNOWN_HOST%% *}
          [[ $host =~ ^[0-9]+(\.[0-9]+){3}$ ]]
          gh release view "$RELEASE_TAG" --repo zclucas/RMT --json assets |
            jq -ec --arg tag "$RELEASE_TAG" --argjson probe "$PROBE" '
              {tag: $tag, probe: $probe, assets: [.assets[] |
                select(.name == ("RMT" + $tag + "_x64.zip") or .name == ("RMT" + $tag + "_x86.zip")) |
                {name,size,digest}]} | select(.assets | length == 2)' > "$dir/request"
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$dir/key" \
            "rmt-release@$host" < "$dir/request"
