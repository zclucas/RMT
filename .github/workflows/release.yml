name: Github资源管理

# 由 tag 触发，tag 决定版本性质：
#   v1.3    （无 F 后缀）= 正式版，PackRMT -Release both，本仓库 Release 为 latest
#   v1.3F2  （带 F 后缀）= 测试版，同样双架构打包，本仓库 Release 标记 pre-release
# GitHub Release、资源附件及标签由本工作流管理；GitCode 写操作只调用同步工作流。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      operation:
        description: GitHub 操作（inspect 只查看，不修改）
        type: choice
        default: inspect
        options:
          - inspect
          - shared-url
          - complete-catalogs
          - presentation
          - normalize
          - catalog-names
          - retire-obsolete
          - restore-stable
          - migrate
          - sponsor-cleanup
      resource_runner:
        description: runner 标签；留空时同步/更新用 Ubuntu，历史整理用 macOS
        type: string
      asset_name:
        description: shared-url 必填目标附件名
        type: string
      scope:
        description: shared-url 的资源分类
        type: choice
        options: [Common, Patch]
      url:
        description: shared-url 必填新文件的公开 GitHub Release 下载地址
        type: string
      sha256:
        description: shared-url 必填新文件 SHA-256（64 位小写十六进制）
        type: string

permissions:
  contents: write

concurrency:
  group: rmt-release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  pack:
    if: github.event_name == 'push'
    name: 打包
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node（打包帮助文档 Web/JS/SingleHtml.js 需要）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 准备 AutoHotkey
        uses: ./.github/actions/setup-ahk

      # run 块保持 ASCII-only：Windows 上 shell: powershell 按 ANSI 读临时脚本
      - name: 解析 tag 并校验 RMT_VERSION
        id: tag
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<ver>\d+\.\d+(?:\.\d+)*)(?<pre>F\d+)?$') {
            throw "Unexpected tag format: $tag (expected v1.3 / v1.3F2)"
          }
          $version = $Matches.ver + $Matches.pre
          $channel = if ($Matches.pre) { 'test' } else { 'stable' }

          $rmt = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'RMT.ahk') -Raw -Encoding UTF8
          if ($rmt -notmatch '(?m)^\s*global\s+RMT_VERSION\s*:=\s*"([^"]+)"') {
            throw 'Cannot read RMT_VERSION from RMT.ahk'
          }
          if ($Matches[1] -ne $version) {
            throw "Tag $tag does not match RMT_VERSION '$($Matches[1])' in RMT.ahk"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "RMT_TAG_VERSION=$version"
          Add-Content -Path $env:GITHUB_ENV -Value "RMT_TAG_CHANNEL=$channel"
          Add-Content -Path $env:GITHUB_ENV -Value "RMT_TAG_ASSET=$version"
          Write-Host "version=$version channel=$channel asset_tag=$version"

      - name: 提取当前版本更新日志
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changelog = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'Web/更新日志.md') -Raw -Encoding UTF8
          $version = [regex]::Escape($env:RMT_TAG_VERSION)
          $sections = [regex]::Matches($changelog, "(?ms)^##[ \t]+RMT[ \t]*v$version[ \t]*更新内容[ \t]*\r?\n(?<body>.*?)(?=^##[ \t]+|\z)")
          if ($sections.Count -ne 1 -or [string]::IsNullOrWhiteSpace($sections[0].Groups['body'].Value)) {
            throw "Expected one non-empty changelog section for $env:GITHUB_REF_NAME."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'rmt-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $sections[0].Value.Trim() -Encoding utf8

      - name: 运行 PackRMT.ps1（严格模式，任一环节失败即失败）
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $ErrorActionPreference = 'Continue'

          $params = @{
            NoPause          = $true
            Strict           = $true
            SkipProcessCheck = $true
            Release          = 'both'
            OutDir           = (Join-Path $env:RUNNER_TEMP 'RMTRelease')
          }
          if ($env:A2X)   { $params.Ahk2ExePath = $env:A2X }
          if ($env:AHK64) { $params.Base64Path  = $env:AHK64 }
          if ($env:AHK32) { $params.Base32Path  = $env:AHK32 }

          & (Join-Path $env:GITHUB_WORKSPACE 'Scripts\PackRMT.ps1') @params
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit 0

      - name: 校验两个架构的更新程序与帮助文档已打包
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          function Assert-ZipEntry($zipPath, $entryPath) {
            $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              $entry = $zip.Entries | Where-Object { $_.FullName.Replace('\', '/') -ceq $entryPath }
              if (-not $entry -or $entry.Length -eq 0) {
                throw "Missing or empty ${entryPath} in $zipPath"
              }
            } finally {
              $zip.Dispose()
            }
          }

          $outDir = Join-Path $env:RUNNER_TEMP 'RMTRelease'
          foreach ($arch in 'x64', 'x86') {
            Assert-ZipEntry (Join-Path $outDir "RMTv$($env:RMT_TAG_VERSION)_$arch.zip") 'Thread/Update.exe'
            Assert-ZipEntry (Join-Path $outDir "RMTAssets_$arch/RMT.zip") 'Update.exe'
            Assert-ZipEntry (Join-Path $outDir "RMTv$($env:RMT_TAG_VERSION)_$arch.zip") 'index.html'
            Assert-ZipEntry (Join-Path $outDir "RMTAssets_$arch/RMT.zip") 'index.html'
          }

      - name: 写入 release-info.json
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'RMTRelease'
          $info = [ordered]@{
            version   = $env:RMT_TAG_VERSION
            channel   = $env:RMT_TAG_CHANNEL
            asset_tag = $env:RMT_TAG_ASSET
            tag       = $env:GITHUB_REF_NAME
            sha       = $env:GITHUB_SHA
          }
          $info | ConvertTo-Json | Out-File -FilePath (Join-Path $outDir 'release-info.json') -Encoding utf8
          Write-Host (Get-Content (Join-Path $outDir 'release-info.json') -Raw)

      - name: 创建本仓库 Release（测试版标记 pre-release）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'RMTRelease'
          $notesPath = Join-Path $env:RUNNER_TEMP 'rmt-release-notes.md'
          $zips = @(Get-ChildItem -LiteralPath $outDir -Filter 'RMTv*.zip' -File)
          if ($zips.Count -eq 0) { throw 'no RMTv*.zip found to attach to the release' }
          $extra = @()
          if ($env:RMT_TAG_CHANNEL -eq 'test') { $extra += '--prerelease' }
          # PS5.1: never redirect native stderr (2>$null/2>&1) with ErrorActionPreference=Stop;
          # it converts stderr lines into terminating errors. "release not found" in the
          # log is expected on first publish; the exit code below is the real signal.
          gh release view $env:GITHUB_REF_NAME | Out-Null
          if ($LASTEXITCODE -eq 0) {
            if ($env:RMT_TAG_CHANNEL -eq 'test') {
              gh release upload $env:GITHUB_REF_NAME @($zips.FullName) --clobber
              if ($LASTEXITCODE -ne 0) { throw "failed to upload assets for $env:GITHUB_REF_NAME" }
            } else {
              $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME"
              if ($LASTEXITCODE -ne 0) { throw 'failed to inspect existing stable assets' }
              $release = $releaseJson | ConvertFrom-Json
              $missing = @()
              # Validate every existing attachment before adding any new file.
              foreach ($zip in $zips) {
                $existing = @($release.assets | Where-Object { $_.name -eq $zip.Name })
                if ($existing.Count -eq 0) { $missing += $zip; continue }
                $digest = 'sha256:' + (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($existing.Count -ne 1 -or $existing[0].size -ne $zip.Length -or $existing[0].digest -ne $digest) {
                  throw "stable release is append-only; cannot replace $($zip.Name)"
                }
              }
              foreach ($zip in $missing) {
                gh release upload $env:GITHUB_REF_NAME $zip.FullName
                if ($LASTEXITCODE -ne 0) { throw "failed to add $($zip.Name)" }
              }
            }
            gh release edit $env:GITHUB_REF_NAME --title "RMT$env:GITHUB_REF_NAME" --notes-file $notesPath
          } else {
            gh release create $env:GITHUB_REF_NAME @($zips.FullName) @($extra) `
              --title "RMT$env:GITHUB_REF_NAME" `
              --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) { throw "failed to publish release $env:GITHUB_REF_NAME" }
          Write-Host "Published $($zips.Count) zip(s) to release $env:GITHUB_REF_NAME"

      - name: 上传打包产物（供后续资源发布任务使用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmt-release
          path: |
            ${{ runner.temp }}/RMTRelease/release-info.json
            ${{ runner.temp }}/RMTRelease/RMTv*.zip
            ${{ runner.temp }}/RMTRelease/RMTAssets_*
          if-no-files-found: error
          retention-days: 30

      - name: 上传打包日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-logs
          path: Log/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: 汇总日志到任务摘要
        if: always()
        shell: pwsh
        run: |
          $md = @()
          $md += '## RMT GitHub 资源发布'
          $md += ''
          $md += '| 项目 | 值 |'
          $md += '| --- | --- |'
          $md += "| tag | $env:GITHUB_REF_NAME |"
          $md += '| 类型 | ' + $(if ($env:RMT_TAG_CHANNEL -eq 'stable') { '正式版' } else { '测试版' }) + ' |'
          $md += "| 提交 | $($env:GITHUB_SHA.Substring(0,7)) |"

          $log = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'Log') -Filter 'PackRMT_*.log' -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (-not $log) {
            $md += '| 结果 | 未生成日志（脚本可能在写入前就退出） |'
          }
          else {
            $text  = Get-Content -LiteralPath $log.FullName -Raw
            $lines = $text -split "`r?`n"
            $errs  = @($lines | Where-Object { $_ -match '\[ERROR\]' } | ForEach-Object { $_.Trim() })
            $warns = @($lines | Where-Object { $_ -match '\[WARN\]' })
            $ok    = $text -match '\[RESULT\] BUILD OK'

            $md += "| 结果 | $(if ($ok) { '成功' } else { '失败' }) |"
            $md += "| 错误行数 | $($errs.Count) |"
            $md += "| 警告行数 | $($warns.Count) |"
            $md += "| 日志文件 | $($log.Name) |"

            if ($errs.Count -gt 0) {
              $md += ''
              $md += '### 错误摘录'
              $md += '```'
              $md += @($errs | Select-Object -First 20)
              $md += '```'
            }
            if (-not $ok) {
              foreach ($e in ($errs | Select-Object -First 5)) { Write-Host "::error::$e" }
            }
          }

          $md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  upload:
    name: 发布 GitHub 分层资源
    needs: pack
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: rmt-resource-publication
      cancel-in-progress: false
      queue: max
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 校验版本标签仍指向当前提交
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $remoteSha = gh api "repos/$env:REPO/commits/$env:RELEASE_REF" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or -not $remoteSha -or $remoteSha.Trim() -ne $env:RELEASE_SHA) {
            throw '版本标签已删除或改指向，停止发布旧提交的资源。'
          }
      - name: 下载本次打包产物
        uses: actions/download-artifact@v4
        with:
          name: rmt-release
          path: ${{ runner.temp }}/rmt-release
      - name: 上传 GitHub 资源
        env:
          GH_TOKEN: ${{ secrets.RMT_ASSETS_TOKEN }}
          RMT_RESOURCE_PROVIDER: github
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'rmt-release'
          $infoPath = Join-Path $out 'release-info.json'
          $info = Get-Content -LiteralPath $infoPath -Raw | ConvertFrom-Json
          if ($info.sha -ne $env:RELEASE_SHA) { throw '打包产物与当前提交不匹配。' }
          & (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/Upload-RmtAssets.ps1') -InfoPath $infoPath -OutDir $out -Repo 'zclucas/RMTAssets'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 保存资源发布结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-layout-result
          path: ${{ runner.temp }}/resource-layout-result.json

  sync_release:
    name: 同步 GitCode
    needs: upload
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sync-gitcode.yml
    with:
      operation: mirror-all
    secrets:
      GITCODE_RELEASE: ${{ secrets.GITCODE_RELEASE }}

  maintain:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: rmt-resource-publication
      cancel-in-progress: false
      queue: max
    name: 资源维护 / ${{ inputs.operation }}
    runs-on: ${{ inputs.resource_runner || ((inputs.operation == 'inspect' || inputs.operation == 'shared-url' || inputs.operation == 'sponsor-cleanup') && 'ubuntu-latest' || 'macos-latest') }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 执行所选维护操作
        env:
          GH_TOKEN: ${{ inputs.operation == 'inspect' && github.token || secrets.RMT_ASSETS_TOKEN }}
          RMT_RESOURCE_PROVIDER: github
          RESOURCE_OPERATION: ${{ inputs.operation }}
          ASSET_NAME: ${{ inputs.asset_name }}
          SCOPE: ${{ inputs.scope }}
          SOURCE_URL: ${{ inputs.url }}
          SOURCE_SHA256: ${{ inputs.sha256 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonCommand = if ($IsWindows) { 'python' } else { 'python3' }
          switch ($env:RESOURCE_OPERATION) {
            'inspect' {
              gh release list --repo zclucas/RMT --limit 20
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              gh release list --repo zclucas/RMTAssets --limit 30
            }
            'sponsor-cleanup' {
              & $pythonCommand -u .github/scripts/sync_gitcode_assets.py sponsor-cleanup
            }
            'shared-url' {
              if (-not $env:ASSET_NAME -or -not $env:SOURCE_URL -or $env:SOURCE_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
                throw 'shared-url 必须提供附件名、公开下载地址及 64 位小写 SHA-256。'
              }
              & $pythonCommand -u .github/scripts/resource_layout.py shared-url --scope $env:SCOPE --name $env:ASSET_NAME --url $env:SOURCE_URL --sha256 $env:SOURCE_SHA256
            }
            default {
              & $pythonCommand -u .github/scripts/resource_layout.py $env:RESOURCE_OPERATION
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 保存维护结果与重建备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-maintenance-result
          path: |
            ${{ runner.temp }}/gitcode-sync.json
            ${{ runner.temp }}/gitcode-sponsor-cleanup.json
            ${{ runner.temp }}/resource-layout-result.json
            ${{ runner.temp }}/resource-rebuild-backup.json


  sync_maintenance:
    name: 同步维护结果到 GitCode
    needs: maintain
    if: inputs.operation != 'inspect'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sync-gitcode.yml
    with:
      operation: mirror-all
    secrets:
      GITCODE_RELEASE: ${{ secrets.GITCODE_RELEASE }}
