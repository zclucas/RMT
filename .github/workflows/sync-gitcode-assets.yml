name: 同步 GitCode 资源
on:
  workflow_call:
    inputs:
      asset_tags:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gitcode-resource-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 同步原文件并核对公开下载
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_RELEASE }}
          ASSET_TAGS: ${{ inputs.asset_tags }}
        run: python3 -u .github/scripts/sync_gitcode_assets.py sync --tags "$ASSET_TAGS" --workers 2
  model:
    if: contains(fromJSON(inputs.asset_tags), 'Common')
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 按已验证策略同步翻译模型
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_RELEASE }}
        run: python3 -u .github/scripts/sync_gitcode_assets.py model --model-mode configured
