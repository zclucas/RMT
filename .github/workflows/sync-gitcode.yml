name: GitCode同步
on:
  push:
    branches: ['**']
    tags: ['**']
  create:
  delete:
  # 补偿由 GITHUB_TOKEN 操作或漏发事件造成的镜像遗漏。
  schedule:
    - cron: '17 4 * * *'
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      operation:
        description: mirror 同步两仓库；sync 仅资源；默认预览 GitCode 发行顺序
        type: choice
        default: plan-presentation
        options: [plan-presentation, mirror, sync, rebuild-presentation]
      tag:
        description: sync 的资源标签；留空同步全部
        type: string
      asset_name:
        description: sync 的附件名；留空同步整个标签
        type: string
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
    secrets:
      GITCODE_RELEASE:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  mirror:
    if: inputs.operation == 'mirror-all' || (github.event_name != 'workflow_dispatch' && inputs.operation == '') || inputs.operation == 'mirror'
    concurrency:
      group: rmt-resource-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: 同步代码、分支与标签
        env:
          GIT_TERMINAL_PROMPT: '0'
          GITCODE_TOKEN: ${{ secrets.GITCODE_RELEASE }}
        run: python3 -u .github/scripts/mirror_rmt_refs.py
      # 分支变化及定时校准只同步 Git 引用，避免重复上传全部附件。
      - name: 同步所有已发布版本与附件并校验公开下载
        if: inputs.operation == 'mirror-all' || github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_RELEASE }}
        run: python3 -u .github/scripts/sync_gitcode_assets.py sync --repo RMT --workers 2
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.operation == 'mirror-all' || github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
        with:
          name: gitcode-release-result
          path: ${{ runner.temp }}/gitcode-sync.json


      - name: 同步资源仓库的附件与清单
        if: inputs.operation == 'mirror-all' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_RELEASE }}
        run: python3 -u .github/scripts/sync_gitcode_assets.py sync --repo RMTAssets --workers 2
      - name: 保存 GitCode 资源同步结果
        if: always() && (inputs.operation == 'mirror-all' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: gitcode-assets-result
          path: ${{ runner.temp }}/gitcode-sync.json

  resources:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'mirror' && inputs.operation != 'mirror-all'
    concurrency:
      group: rmt-resource-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 执行 GitCode 资源操作
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_RELEASE }}
          RESOURCE_OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ inputs.tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RESOURCE_OPERATION -eq 'sync') {
            $syncArgs = @('-u', '.github/scripts/sync_gitcode_assets.py', 'sync', '--workers', '2')
            if ($env:RELEASE_TAG) { $syncArgs += @('--tag', $env:RELEASE_TAG) }
            if ($env:ASSET_NAME) { $syncArgs += @('--asset-name', $env:ASSET_NAME) }
            python3 @syncArgs
          } else {
            python3 -u .github/scripts/resource_layout.py $env:RESOURCE_OPERATION
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitcode-resource-result
          path: |
            ${{ runner.temp }}/gitcode-sync.json
            ${{ runner.temp }}/resource-layout-result.json
            ${{ runner.temp }}/resource-rebuild-backup.json
