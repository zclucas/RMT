name: 资源更新

# 分支推送打包并发布资源，手动运行用于检查打包。

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  # 各分支共用同一版本的 Release，推送任务依次运行。
  group: rmt-pack-${{ github.event_name }}
  queue: max

permissions:
  contents: read

jobs:
  pack:
    name: 打包 x64 / x86 并发布资源
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node（打包帮助文档 Web/JS/SingleHtml.js 需要）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 运行时和编译器都使用官方 release 归档，避免依赖 Chocolatey 的包索引和安装器状态。
      - name: 安装 AutoHotkey v2 与 Ahk2Exe
        run: |
          $ErrorActionPreference = 'Stop'
          $ahkVer = '2.0.31'
          $a2xVer = 'Ahk2Exe1.1.37.02a2'

          # 1) runtime (v2 base binaries) from the official release zip
          $ahkZip = Join-Path $env:RUNNER_TEMP "autohotkey-$ahkVer.zip"
          $ahkDir = Join-Path $env:RUNNER_TEMP 'autohotkey'
          Write-Host "download: AutoHotkey v$ahkVer"
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$ahkVer/AutoHotkey_$ahkVer.zip" `
            -OutFile $ahkZip -UseBasicParsing -TimeoutSec 300
          Expand-Archive -LiteralPath $ahkZip -DestinationPath $ahkDir -Force
          $ahk64 = (Get-ChildItem -LiteralPath $ahkDir -Recurse -Filter 'AutoHotkey64.exe' |
                    Select-Object -First 1).FullName
          $ahk32 = (Get-ChildItem -LiteralPath $ahkDir -Recurse -Filter 'AutoHotkey32.exe' |
                    Select-Object -First 1).FullName
          if (-not $ahk64) { throw "AutoHotkey64.exe not found under $ahkDir" }
          if (-not $ahk32) { throw "AutoHotkey32.exe not found under $ahkDir" }
          # 2) compiler via the official Ahk2Exe zip
          $a2xZip = Join-Path $env:RUNNER_TEMP 'ahk2exe.zip'
          Write-Host "download: Ahk2Exe $a2xVer"
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/Ahk2Exe/releases/download/$a2xVer/$a2xVer.zip" `
            -OutFile $a2xZip -UseBasicParsing -TimeoutSec 300
          $a2xDir = Join-Path $env:RUNNER_TEMP 'ahk2exe'
          Expand-Archive -LiteralPath $a2xZip -DestinationPath $a2xDir -Force
          $ahk2exe = (Get-ChildItem -LiteralPath $a2xDir -Recurse -Filter 'Ahk2Exe.exe' |
                      Select-Object -First 1).FullName
          if (-not $ahk2exe) { throw 'Ahk2Exe.exe not found in the official zip' }

          Add-Content -Path $env:GITHUB_ENV -Value "A2X=$ahk2exe"
          Add-Content -Path $env:GITHUB_ENV -Value "AHK64=$ahk64"
          Add-Content -Path $env:GITHUB_ENV -Value "AHK32=$ahk32"

          Write-Host "Ahk2Exe      : $ahk2exe ($((Get-Item $ahk2exe).VersionInfo.FileVersion))"
          Write-Host "AutoHotkey64 : $ahk64 ($((Get-Item $ahk64).VersionInfo.FileVersion))"
          Write-Host "AutoHotkey32 : $ahk32 ($((Get-Item $ahk32).VersionInfo.FileVersion))"
          Write-Host "node         : $(node -v)"

      - name: 运行 PackRMT.ps1（严格模式，任一环节失败即失败）
        run: |
          # keep this block ASCII-only: on Windows, shell: powershell reads the temp script as ANSI
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $ErrorActionPreference = 'Continue'

          # both => build and pack BOTH ReleaseX64 and ReleaseX86
          $params = @{
            NoPause          = $true
            Strict           = $true
            SkipProcessCheck = $true
            Release          = 'both'
            OutDir           = (Join-Path $env:RUNNER_TEMP 'RMTRelease')
          }
          if ($env:A2X)   { $params.Ahk2ExePath = $env:A2X }
          if ($env:AHK64) { $params.Base64Path  = $env:AHK64 }
          if ($env:AHK32) { $params.Base32Path  = $env:AHK32 }

          & (Join-Path $env:GITHUB_WORKSPACE 'PackRMT.ps1') @params
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit 0

      - name: 发布资源到 RMTAssets
        if: success() && github.repository == 'zclucas/RMT' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RMT_ASSETS_TOKEN }}
        run: |
          $versionFile = Join-Path $env:GITHUB_WORKSPACE 'RMT.ahk'
          $versionLine = Get-Content -LiteralPath $versionFile -Raw -Encoding UTF8
          if ($versionLine -notmatch '(?m)^\s*global\s+RMT_VERSION\s*:=\s*"(?<version>\d+\.\d+(?:\.\d+)*)(?:F\d+)?"') {
            throw '无法从 RMT.ahk 读取资源发布版本。'
          }
          $version = $Matches.version

          # 分支已推进或删除时，旧任务仍可完成打包，但不再发布。
          $head = git ls-remote --refs origin $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { throw "无法读取远端分支：$env:GITHUB_REF" }
          if (-not $head -or ($head -split '\s+')[0] -ne $env:GITHUB_SHA) {
            Write-Host "$env:GITHUB_REF_NAME 已更新或删除，跳过这次旧提交的资源发布。"
            exit 0
          }
          if (-not $env:GH_TOKEN) {
            throw '请配置 Actions Secret RMT_ASSETS_TOKEN，并授予它对 zclucas/RMTAssets 的 Contents 写入权限。'
          }

          $repo = 'zclucas/RMTAssets'
          $outDir = Join-Path $env:RUNNER_TEMP 'RMTRelease'
          $architectures = @('x64', 'x86')
          $assetsByArch = @{}
          foreach ($arch in $architectures) {
            $assetDir = Join-Path $outDir "RMTAssets_$arch"
            $assets = @(Get-ChildItem -LiteralPath $assetDir -File)
            if ($assets.Count -eq 0 -or ($assets | Where-Object Length -eq 0)) {
              throw "资源目录没有生成可上传的完整文件：$assetDir"
            }
            $assetsByArch[$arch] = @($assets.FullName)
          }

          foreach ($arch in $architectures) {
            $tag = "v${version}_$arch"
            $assets = $assetsByArch[$arch]
            gh release view $tag --repo $repo --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @assets --repo $repo --clobber
            } else {
              gh release create $tag @assets --repo $repo --title $tag --latest=false --notes "RMT build from $env:GITHUB_REF_NAME ($env:GITHUB_SHA)"
            }
            if ($LASTEXITCODE -ne 0) { throw "资源发布失败：$repo $tag" }
            Write-Host "Published $($assets.Count) assets to $repo $tag"
          }

      - name: 汇总日志到任务摘要
        if: always()
        shell: pwsh
        run: |
          $md = @()
          $md += '## RMT 打包检查'
          $md += ''
          $md += '| 项目 | 值 |'
          $md += '| --- | --- |'
          $md += "| 分支 | $env:GITHUB_REF_NAME |"
          $md += "| 提交 | $($env:GITHUB_SHA.Substring(0,7)) |"

          $log = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'Log') -Filter 'PackRMT_*.log' -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (-not $log) {
            $md += '| 结果 | 未生成日志（脚本可能在写入前就退出） |'
          }
          else {
            $text  = Get-Content -LiteralPath $log.FullName -Raw
            $lines = $text -split "`r?`n"
            $errs  = @($lines | Where-Object { $_ -match '\[ERROR\]' } | ForEach-Object { $_.Trim() })
            $warns = @($lines | Where-Object { $_ -match '\[WARN\]' })
            $ok    = $text -match '\[RESULT\] BUILD OK'

            $md += "| 结果 | $(if ($ok) { '成功' } else { '失败' }) |"
            $md += "| 错误行数 | $($errs.Count) |"
            $md += "| 警告行数 | $($warns.Count) |"
            $md += "| 日志文件 | $($log.Name) |"

            if ($errs.Count -gt 0) {
              $md += ''
              $md += '### 错误摘录'
              $md += '```'
              $md += @($errs | Select-Object -First 20)
              $md += '```'
            }
            if (-not $ok) {
              foreach ($e in ($errs | Select-Object -First 5)) { Write-Host "::error::$e" }
            }
          }

          $md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 上传打包日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-logs
          path: Log/*.log
          if-no-files-found: warn
          retention-days: 14

