name: Gitee Go 传输试跑

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已同时发布整包及资源的 GitHub 标签
        required: true
        type: string

      sample:
        description: 样本范围（small 用于快速验证上传和回读）
        type: choice
        default: both
        options:
          - both
          - small

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 触发并核对 Gitee Go 试跑结果
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
          SAMPLE: ${{ inputs.sample }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/gitee_go_trial.py
